name: Android development preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'apps/**', 'packages/**', 'runtime/**', 'upstream/**', 'third_party/**', 'scripts/**', 'tests/**', 'package*.json', 'capacitor.config.ts', 'vite.config.ts', 'tsconfig*.json', 'index.html', '.github/workflows/android-preview.yml']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qq-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:host
      - run: python3 scripts/build-runtime.py
      - name: Verify packaged Node cwd, file I/O and child execution under PRoot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtalloc-dev clang lld
          git init "$RUNNER_TEMP/hds-proot-source"
          git -C "$RUNNER_TEMP/hds-proot-source" fetch --depth=1 https://github.com/termux/proot a7147b50d708567dbf884d21e0f0c8698bba0d10
          git -C "$RUNNER_TEMP/hds-proot-source" checkout --detach FETCH_HEAD
          # These two build inputs are vendored in third_party/ instead of fetched
          # from raw.githubusercontent.com: that host rate-limits per client IP
          # (HTTP 429), which flaked this job on 2026-10-14. Copy the repo's own
          # verified copies so CI no longer depends on the CDN.
          patch -d "$RUNNER_TEMP/hds-proot-source" -p1 < third_party/proot-patches/termux-proot-operit-android.patch
          mkdir -p "$RUNNER_TEMP/hds-proot-source/src/linux"
          cp third_party/linux-uapi/ashmem.h "$RUNNER_TEMP/hds-proot-source/src/linux/ashmem.h"
          # This test and guest are ARM64-only; Ubuntu's compiler cannot build
          # the fork's optional 32-bit loader with its x86-specific -m32 flag.
          sed -i '/#define HAS_LOADER_32BIT true/d' "$RUNNER_TEMP/hds-proot-source/src/arch.h"
          sed -i 's/-Ttext=$(LOADER_ADDRESS$1)/--image-base=$(LOADER_ADDRESS$1)/' "$RUNNER_TEMP/hds-proot-source/src/GNUmakefile"
          make -C "$RUNNER_TEMP/hds-proot-source/src" -j2 CC=clang LD='clang -fuse-ld=lld'
          HDS_TEST_PROOT="$RUNNER_TEMP/hds-proot-source/src/proot" python3 scripts/probe-linux-proot.py
      - name: Verify QQ in actual packaged ARM64 userspace, without an account login
        run: |
          npx esbuild scripts/qq-linux-smoke.ts --bundle --platform=node --format=cjs --packages=external --outfile=runtime/generated/rootfs/opt/hds/qq-smoke.cjs
          sudo mkdir -p runtime/generated/rootfs/{dev,proc,sys,qq-data}
          sudo mount --bind /dev runtime/generated/rootfs/dev
          sudo mount -t proc proc runtime/generated/rootfs/proc
          sudo mount --bind /sys runtime/generated/rootfs/sys
          cc -shared -fPIC scripts/deny-x11-hardlinks.c -o runtime/generated/rootfs/opt/hds/deny-x11-hardlinks.so
          npx esbuild scripts/xvfb-lock-smoke.ts --bundle --platform=node --format=cjs --outfile=runtime/generated/rootfs/opt/hds/xvfb-lock-smoke.cjs
          sudo chroot runtime/generated/rootfs /usr/bin/env PATH=/opt/node/bin:/usr/bin:/bin /opt/node/bin/node /opt/hds/xvfb-lock-smoke.cjs
          sudo chroot runtime/generated/rootfs /usr/bin/env HOME=/root PATH=/opt/node/bin:/usr/bin:/bin OPENSSL_CONF=/etc/ssl/openssl.cnf /opt/node/bin/node /opt/hds/qq-smoke.cjs
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fixed JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test actual HDS host
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/host-tests.log
          npm run build
          npx cap sync android
      - name: Test runtime archive policy
        run: |
          python3 tests/runtime-pack.test.py
          python3 tests/guest-openssl-config.test.py
      - name: Verify image protocol settings and diagnostics UI
        run: |
          npx playwright-core install --with-deps chromium
          node tests/experience-ui.mjs
          node tests/message-diagnostics-ui.mjs
          node tests/preview97-ui.mjs
      - name: Verify and retain actual preview.1 rootfs regression input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-preview.1 --repo "$GITHUB_REPOSITORY" --pattern '*arm64.apk' --dir "$RUNNER_TEMP/legacy-hds"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          apk = next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'legacy-hds').glob('*.apk'))
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == 'd6b70ce404c5fa38870434c64759a542994c7e7f113163978b11b2f4cce5ba46'
          with zipfile.ZipFile(apk) as source:
              (pathlib.Path(os.environ['RUNNER_TEMP']) / 'rootfs-preview1.bundle').write_bytes(source.read('assets/runtime/rootfs.bundle'))
          PY
      - name: Ensure Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Compile Android bridge before runtime packaging
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon compileReleaseKotlin
      - name: Build checksum-verified ARM64 runtime
        run: python3 scripts/build-runtime.py
      - name: Restore private signing key
        env:
          HDS_SIGNING_STORE_B64: ${{ secrets.HDS_SIGNING_STORE_B64 }}
        run: |
          test -n "$HDS_SIGNING_STORE_B64"
          printf '%s' "$HDS_SIGNING_STORE_B64" | base64 --decode > "$RUNNER_TEMP/hds-preview.keystore"
      - name: Build signed APK and run Android checks
        env:
          HDS_LEGACY_ROOTFS: ${{ runner.temp }}/rootfs-preview1.bundle
          HDS_SIGNING_STORE: ${{ runner.temp }}/hds-preview.keystore
          HDS_SIGNING_PASSWORD: ${{ secrets.HDS_SIGNING_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease :app:assembleDebugAndroidTest
      - name: Package verification and release materials
        run: |
          HDS_VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/HDS-Android-$HDS_VERSION-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/apk-signature.txt
          cp runtime/generated/runtime-manifest.json artifacts/
          cp docs/TEST-ON-PHONE.md artifacts/
          cp fixtures/cards/*.json fixtures/cards/*.yml artifacts/
          git archive --format=tar HEAD | gzip -n > artifacts/HDS-Android-$HDS_VERSION-source.tar.gz
          cd artifacts
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
      - name: Upload preview and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HDS-Android-preview-${{ github.sha }}
          path: |
            artifacts/
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 30

  publish-preview-97:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qq-linux-arm64, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish signed Preview 9.7 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = "0.1.0-preview.9.7"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "HDS-Android-preview-$GITHUB_SHA" --dir release-artifacts
          apk=$(find release-artifacts -name 'HDS-Android-0.1.0-preview.9.7-arm64.apk' -print -quit)
          source=$(find release-artifacts -name 'HDS-Android-0.1.0-preview.9.7-source.tar.gz' -print -quit)
          sums=$(find release-artifacts -name 'SHA256SUMS.txt' -print -quit)
          test -s "$apk" && test -s "$source" && test -s "$sums"
          (cd "$(dirname "$sums")" && sha256sum -c SHA256SUMS.txt)
          gh release create v0.1.0-preview.9.7 "$apk" "$source" "$sums" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'HDSI Android 0.1.0-preview.9.7' --notes-file docs/PREVIEW9.7.md --latest
